name: restore-lockfile
on:
  push:
    paths:
      - ".github/workflows/restore-lockfile.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download complete package-lock.json
        run: |
          set -euo pipefail
          curl -fsSL -o package-lock.json "https://litter.catbox.moe/w2fk5i.json" \
            || curl -fsSL -o package-lock.json "https://tmpfiles.org/dl/wowRBzRWom29/package-lock.json"
          wc -c package-lock.json
          python3 - <<'PY'
          import json, pathlib
          raw = pathlib.Path("package-lock.json").read_bytes()
          assert len(raw) == 302770, len(raw)
          data = json.loads(raw)
          n = len(data.get("packages", {}))
          assert n == 567, n
          print("ok packages", n)
          PY
      - name: Commit lockfile and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/restore-lockfile.yml
          git add package-lock.json
          git commit -m "Complete package-lock.json"
          git push
